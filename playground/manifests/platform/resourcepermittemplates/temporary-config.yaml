---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: permit-config-writer
  namespace: solar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: permit-config-writer
  namespace: solar-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: permit-config-writer
  namespace: solar-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: permit-config-writer
subjects:
  - kind: ServiceAccount
    name: permit-config-writer
    namespace: solar-system
---
apiVersion: addons.projectcapsule.dev/v1beta2
kind: ResourcePermitTemplate
metadata:
  name: temporary-config
  namespace: solar-system
spec:
  defaultDuration: 30m
  maxDuration: 2h
  keepFor: 7d
  impersonation:
    name: permit-config-writer
  approvals:
    auto: false
    approvers:
      - kind: Group
        name: platform-on-call
  paramSchema:
    type: object
    additionalProperties: false
    required: [message]
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 200
  resources:
    - policy:
        creation: Owner
        protect: true
        force: false
        deletion: Remove
      targets:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ .request.name }}'
          data:
            message: '{{ .message }}'
            requestedBy: '{{ .request.username }}'
