apiVersion: addons.projectcapsule.dev/v1beta2
kind: ResourcePermitTemplate
metadata:
  name: temporary-config
  namespace: solar-system
spec:
  defaultDuration: 30m
  maxDuration: 2h
  keepFor: 7d
  impersonation:
    name: permit-config-writer
  approvals:
    auto: false
    approvers:
      - kind: Group
        name: platform-on-call
  paramSchema:
    type: object
    additionalProperties: false
    required: [message]
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 200
  resources:
    - policy:
        creation: Owner
        protect: true
        force: false
        deletion: Remove
      targets:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ .request.name }}'
          data:
            message: '{{ .message }}'
            requestedBy: '{{ .request.username }}'
