apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: resource-permits-proxy-settings
spec:
  scope: Tenant
  resyncPeriod: 30s
  serviceAccount:
    name: gtr-reconciler
    namespace: capsule-system
  resources:
    - policy:
        creation: Owner
        force: false
        protect: true
        deletion: Remove
      generators:
        - missingKey: zero
          template: |-
            ---
            apiVersion: capsule.clastix.io/v1beta1
            kind: GlobalProxySettings
            metadata:
              name: {{ $.tenant.metadata.name }}-proxy-settings
            spec:
              rules:
              - subjects:
                {{- range $.tenant.status.owners }}
                - kind: {{ .kind }}
                  name: {{ .name }}
                {{- end }}
                clusterResources:
                - apiGroups:
                  - "addons.projectcapsule.dev"
                  resources:
                  - "globalresourcepermittemplates"
                  operations:
                  - List
                  selector:
                    matchLabels:
                      company.com/consumer: "tenants"
