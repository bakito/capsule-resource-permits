{{- if not .Values.crds.exclusive }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "resource-permits.fullname" . }}-manager
  labels:
    {{- include "resource-permits.labels" . | nindent 4 }}
rules:
  {{- $role := .Files.Get "files/manager-role.yaml" | fromYaml }}
  {{- toYaml $role.rules | nindent 2 }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "resource-permits.fullname" . }}-manager
  labels:
    {{- include "resource-permits.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "resource-permits.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "resource-permits.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.requester.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "resource-permits.fullname" . }}-requester
  labels:
    {{- include "resource-permits.labels" . | nindent 4 }}
    {{- with .Values.rbac.requester.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: [addons.projectcapsule.dev]
    resources: [resourcepermits, resourcepermits/status]
    verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
{{- end }}
