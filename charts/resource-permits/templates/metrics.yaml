{{- if not .Values.crds.exclusive }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resource-permits.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resource-permits.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  selector:
    {{- include "resource-permits.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: metrics
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "resource-permits.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resource-permits.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "resource-permits.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: http
      scheme: http
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
