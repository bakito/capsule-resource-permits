name: test
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build kubectl-resource_permits
  e2e:
    runs-on: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - name: Download the matching Capsule source
        run: go mod download github.com/projectcapsule/capsule
      - name: Install test tools
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          go install github.com/google/ko@v0.18.0
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.28.1
      - name: Install both controllers and run addon e2e
        env:
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: ./hack/e2e.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e
          path: e2e-artifacts
