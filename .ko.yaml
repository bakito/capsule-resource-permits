defaultBaseImage: gcr.io/distroless/static:nonroot
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: controller
    main: "./cmd/controller"
    env:
      - CGO_ENABLED=0
    flags:
      - "-trimpath"
    ldflags:
      - "-s -w -X github.com/projectcapsule/resource-permits/internal/version.GitTag={{.Env.VERSION}}"
